<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DECOR GO</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
            text-align: center;
        }

        header {
            background: #111;
            color: white;
            padding: 25px;
        }

        header h1 {
            margin: 0;
            font-size: 35px;
        }

        header span {
            color: #c9a227;
        }

        main {
            padding: 60px 20px;
        }

        h2 {
            font-size: 30px;
        }

        p {
            font-size: 19px;
            line-height: 1.8;
        }

        .button {
            display: inline-block;
            margin-top: 20px;
            padding: 15px 30px;
            background: #c9a227;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 18px;
        }

        footer {
            background: #111;
            color: white;
            padding: 20px;
            margin-top: 50px;
        }
    </style>
</head>

<body>

    <header>
        <h1>DECOR <span>GO</span></h1>
    </header>

    <main>
        <h2>أهلاً بكم في ديكور غو</h2>

        <p>
            منصة متخصصة بخدمات الديكور والإكساء
            وتنفيذ أعمال التصميم الداخلي.
        </p>

        <a class="button" href="#">
            اطلب خدمتك
        </a>
    </main>

    <footer>
        © 2026 DECOR GO
    </footer>

</body>
</html>
